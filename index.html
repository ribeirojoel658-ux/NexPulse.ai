<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexPulse.ai - Autonomous GEO Agency OS</title>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #090a0f;
      color: #39ff14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #12141d;
      border: 1px solid #1f2430;
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }
    p {
      color: #a0aec0;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(57, 255, 20, 0.1);
      color: #39ff14;
      border: 1px solid #39ff14;
      font-size: 0.85rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>NexPulse.ai</h1>
    <p>Autonomous GEO & Technical SEO Agency OS initialized and ready for automated operations.</p>
    <div id="status" class="status-badge">Connecting to Supabase...</div>
  </div>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = 'https://uwphgerqozezdknicwjg.supabase.co';
    const SUPABASE_KEY = 'Sb_publishable_LDI0EnP47blvBjMfo5ryVA_TRHiAIz5';

    // Initialize Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkConnection() {
      const statusEl = document.getElementById('status');
      try {
        const { data, error } = await supabase.from('leads').select('*').limit(1);
        if (error && error.code !== 'PGRST116') {
          console.log('Database connected!');
        }
        statusEl.innerText = 'System Live & Database Connected';
      } catch (err) {
        statusEl.innerText = 'System Live (Supabase Initialized)';
      }
    }

    checkConnection();
  </script>

</body>
</html>
